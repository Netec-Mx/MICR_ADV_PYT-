apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: lab10-order-service
  namespace: microservices
spec:
  host: order-service.microservices.svc.cluster.local
  exportTo:
  - '*'
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
  subsets:
  - name: v1
    labels:
      version: v1
  - name: v2
    labels:
      version: v2
---
apiVersion: networking.istio.io/v1
