apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ratelimit-orders
  namespace: microservices
spec:
  rateLimit:
    average: 100
    period: 1m
    burst: 20
    sourceCriterion:
      requestHost: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: circuitbreaker-orders
  namespace: microservices
spec:
  circuitBreaker:
    expression: ResponseCodeRatio(500, 600, 0, 600) > 0.50
    checkPeriod: 100ms
    fallbackDuration: 15s
    recoveryDuration: 30s
---
