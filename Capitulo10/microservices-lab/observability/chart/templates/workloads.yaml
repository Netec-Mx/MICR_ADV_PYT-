apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
      annotations:
        lab08/config-checksum: {{ include (print $.Template.BasePath "/configmaps.yaml") . | sha256sum | quote }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 472
        fsGroup: 472
      containers:
      - name: grafana
        image: {{ .Values.images.grafana | quote }}
        ports:
        - name: p3000
          containerPort: 3000
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        volumeMounts:
        - name: config
          mountPath: /etc/grafana/provisioning/datasources/lab.yaml
          subPath: grafana-datasources.yaml
          readOnly: true
        - name: config
          mountPath: /etc/grafana/provisioning/dashboards/lab.yaml
          subPath: grafana-providers.yaml
          readOnly: true
        - name: config
          mountPath: /var/lib/grafana/dashboards/red.json
          subPath: dashboard.json
          readOnly: true
        {{- if .Values.mesh.enabled }}
        - name: mesh-dashboard
          mountPath: /var/lib/grafana/dashboards/mesh.json
          subPath: dashboard.json
          readOnly: true
        {{- end }}
        - name: data
          mountPath: /var/lib/grafana
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          periodSeconds: 5
        startupProbe:
          httpGet:
            path: /api/health
            port: 3000
          periodSeconds: 5
          failureThreshold: 60
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
        env:
        - name: GF_SECURITY_ADMIN_USER
          valueFrom:
            secretKeyRef:
              name: lab08-grafana-admin
              key: admin-user
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: lab08-grafana-admin
              key: admin-password
        - name: GF_USERS_ALLOW_SIGN_UP
          value: 'false'
        - name: GF_ANALYTICS_REPORTING_ENABLED
          value: 'false'
        - name: GF_ANALYTICS_CHECK_FOR_UPDATES
          value: 'false'
        - name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES
          value: 'false'
      volumes:
      - name: config
        configMap:
          name: lab08-grafana
      {{- if .Values.mesh.enabled }}
      - name: mesh-dashboard
        configMap:
          name: lab10-grafana-mesh
      {{- end }}
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
spec:
  selector:
    app: grafana
  ports:
  - name: p3000
    port: 3000
    targetPort: 3000
---
