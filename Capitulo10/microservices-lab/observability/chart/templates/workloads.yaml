apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: observability
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
      annotations:
        lab08/config-checksum: {{ include (print $.Template.BasePath "/configmaps.yaml") . | sha256sum | quote }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 10001
        fsGroup: 10001
      containers:
      - name: otel-collector
        image: {{ .Values.images.collector | quote }}
        ports:
        - name: p4317
          containerPort: 4317
        - name: p4318
          containerPort: 4318
        - name: p13133
          containerPort: 13133
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        volumeMounts:
        - name: config
          mountPath: /etc/otel/collector.yaml
          subPath: collector.yaml
          readOnly: true
        readinessProbe:
          httpGet:
            path: /
            port: 13133
          periodSeconds: 5
        startupProbe:
          httpGet:
            path: /
            port: 13133
          periodSeconds: 5
          failureThreshold: 60
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
        args:
        - --config=/etc/otel/collector.yaml
      volumes:
      - name: config
        configMap:
          name: lab08-collector
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: observability
spec:
  selector:
    app: otel-collector
  ports:
  - name: p4317
    port: 4317
    targetPort: 4317
  - name: p4318
    port: 4318
    targetPort: 4318
  - name: p13133
    port: 13133
    targetPort: 13133
---
