apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
      annotations:
        lab08/config-checksum: {{ include (print $.Template.BasePath "/configmaps.yaml") . | sha256sum | quote }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 65534
        fsGroup: 65534
      containers:
      - name: prometheus
        image: {{ .Values.images.prometheus | quote }}
        ports:
        - name: p9090
          containerPort: 9090
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 1Gi
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus/prometheus.yaml
          subPath: prometheus.yaml
          readOnly: true
        - name: config
          mountPath: /etc/prometheus/rules.yaml
          subPath: rules.yaml
          readOnly: true
        - name: demo
          mountPath: /etc/prometheus/demo
          readOnly: true
        - name: data
          mountPath: /prometheus
        readinessProbe:
          httpGet:
            path: /-/ready
            port: 9090
          periodSeconds: 5
        startupProbe:
          httpGet:
            path: /-/ready
            port: 9090
          periodSeconds: 5
          failureThreshold: 60
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
        args:
        - --config.file=/etc/prometheus/prometheus.yaml
        - --storage.tsdb.path=/prometheus
        - --storage.tsdb.retention.time=2d
        - --web.enable-lifecycle
      volumes:
      - name: config
        configMap:
          name: lab08-prometheus
      - name: demo
        configMap:
          name: lab08-demo-rules
      - name: data
        persistentVolumeClaim:
          claimName: lab08-prometheus-data
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  selector:
    app: prometheus
  ports:
  - name: p9090
    port: 9090
    targetPort: 9090
---
