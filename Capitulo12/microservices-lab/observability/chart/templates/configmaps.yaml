  rules.yaml: |
{{ .Files.Get "files/demo-rules.yaml" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lab08-alertmanager
  namespace: monitoring
data:
  alertmanager.yaml: |
{{ .Files.Get "files/alertmanager.yaml" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lab08-grafana
  namespace: monitoring
data:
  grafana-datasources.yaml: |
{{ .Files.Get "files/grafana-datasources.yaml" | indent 4 }}
  grafana-providers.yaml: |
{{ .Files.Get "files/grafana-providers.yaml" | indent 4 }}
  dashboard.json: |
{{ .Files.Get "files/dashboard.json" | indent 4 }}
{{ if and .Values.lab12 .Values.lab12.enabled }}
  lab12.json: |
{{ .Files.Get "files/dashboard-lab12.json" | indent 4 }}
{{ end }}

{{- if .Values.mesh.enabled }}
