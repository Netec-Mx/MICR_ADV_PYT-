apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: chaos-route
  namespace: microservices
spec:
  entryPoints:
  - web
  routes:
  - match: Host(`microservices.local`) && Path(`/api/v1/users/fail/simulate`)
    kind: Rule
    priority: 100
    services:
    - name: users-service
      port: 8003
    middlewares:
    - name: circuitbreaker-chaos
