apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: microservices
spec:
  selector:
    app: keycloak
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
      - name: keycloak
        image: quay.io/keycloak/keycloak:26.8.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: KC_BOOTSTRAP_ADMIN_USERNAME
          value: admin
        - name: KC_DB
          value: postgres
        - name: KC_DB_URL
          value: jdbc:postgresql://keycloak-db:5432/keycloak
        - name: KC_DB_USERNAME
          value: keycloak
        - name: KC_HOSTNAME
          value: http://localhost:8080
        - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
          value: 'true'
        - name: KC_HEALTH_ENABLED
          value: 'true'
        - name: KC_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: lab06-secrets
              key: KEYCLOAK_DB_PASSWORD
        - name: KC_BOOTSTRAP_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: lab06-secrets
              key: KC_BOOTSTRAP_ADMIN_PASSWORD
        resources:
          requests:
            cpu: 300m
            memory: 768Mi
          limits:
            cpu: '2'
            memory: 1536Mi
        args:
        - start-dev
        - --import-realm
        volumeMounts:
        - name: realm
          mountPath: /opt/keycloak/data/import
          readOnly: true
        readinessProbe:
          exec: &id001
            command:
            - bash
            - -c
            - 'exec 3<>/dev/tcp/127.0.0.1/9000; printf "GET /health/ready HTTP/1.0\r\nHost:
              localhost\r\n\r\n" >&3; read -r line <&3; [[ $line == *200* ]]'
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 12
        startupProbe:
          exec: *id001
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 60
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      volumes:
      - name: realm
        configMap:
          name: keycloak-realm
