apiVersion: batch/v1
kind: Job
metadata:
  name: eventstore-migrate
  namespace: microservices
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 180
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
      - name: migration
        image: order-service:lab06
        imagePullPolicy: IfNotPresent
        command:
        - python
        - -m
        - alembic
        - upgrade
        - head
        env:
        - name: EVENTSTORE_ADMIN_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: lab06-secrets
              key: EVENTSTORE_ADMIN_DATABASE_URL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
