apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: microservices
spec:
  selector:
    app: order-service
  ports:
  - name: http
    port: 8001
    targetPort: 8001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
      - name: order-service
        image: order-service:lab08
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8001
        env:
        - name: AUTH_ENABLED
          value: 'true'
        - name: AUTH_ISSUER
          value: http://localhost:8080/realms/microservices-lab
        - name: AUTH_JWKS_URL
          value: http://keycloak:8080/realms/microservices-lab/protocol/openid-connect/certs
        - name: MESSAGING_ENABLED
          value: 'true'
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: kafka:9092
        - name: EVENTSTORE_ENABLED
          value: 'true'
        - name: RESILIENCE_ENABLED
          value: 'true'
        - name: AUTH_TOKEN_URL
          value: http://keycloak:8080/realms/microservices-lab/protocol/openid-connect/token
        - name: ORDER_SERVICE_CLIENT_ID
          value: order-service-client
        - name: INVENTORY_BASE_URL
          value: http://inventory-service:8002
        - name: RESILIENCE_REDIS_URL
          value: redis://redis:6379/1
        - name: RESILIENCE_NAMESPACE
          value: lab06:orders:normal:inventory
        - name: RESILIENCE_FAIL_MAX
          value: '5'
        - name: RESILIENCE_RESET_TIMEOUT
          value: '30'
        - name: RESILIENCE_MAX_CONCURRENT
          value: '10'
        - name: VAULT_ADDR
          value: http://vault.vault.svc:8200
        - name: VAULT_ROLE
          value: order-service
        - name: VAULT_SECRET_PATH
          value: order-service
        - name: VAULT_POLL_SECONDS
          value: '5'
        - name: VAULT_MAX_AGE_SECONDS
          value: '20'
        - name: OBSERVABILITY_ENABLED
          value: 'true'
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector.observability.svc:4317
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        readinessProbe:
          httpGet: &id001
            path: /health
            port: 8001
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 12
        startupProbe:
          httpGet: *id001
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 60
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 10001
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: vault-jwt
          mountPath: /var/run/secrets/vault
          readOnly: true
        command:
        - python
        - -m
        - shared.vault.launcher
        - --port
        - '8001'
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      serviceAccountName: order-service
      volumes:
      - name: vault-jwt
        projected:
          defaultMode: 288
          sources:
          - serviceAccountToken:
              path: token
              audience: vault
              expirationSeconds: 600
      securityContext:
        fsGroup: 10001
---
