extensions:
  healthcheckv2:
    use_v2: true
    http:
      endpoint: 0.0.0.0:13133
  jaeger_storage:
    backends:
      lab_memory:
        memory:
          max_traces: 10000
  jaeger_query:
    storage:
      traces: lab_memory
    http:
      endpoint: 0.0.0.0:16686
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  batch:
    timeout: 1s
exporters:
  jaeger_storage_exporter:
    trace_storage: lab_memory
service:
  extensions:
  - healthcheckv2
  - jaeger_storage
  - jaeger_query
  pipelines:
    traces:
      receivers:
      - otlp
      processors:
      - batch
      exporters:
      - jaeger_storage_exporter
