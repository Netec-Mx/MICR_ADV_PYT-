name: Lab11 Orders CI and GitOps
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lab11-${{ github.ref }}
  cancel-in-progress: false
env:
  APP_VERSION: 11.0.0
  POSTGRES_TEST_ADMIN_URL: postgresql+asyncpg://postgres:lab11-ci-pass@localhost:15432/postgres
  REDIS_TEST_URL: redis://localhost:16379/0
  KEYCLOAK_TEST_ISSUER: http://localhost:18081/realms/microservices-lab
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install -r order-service/requirements-dev.txt
          python -m pip check
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          bash scripts/lab11/install-helm.sh
          bash scripts/lab09/install-trivy.sh
      - name: Test chart mesh and GitOps recovery contracts
        run: python -m pytest tests-packaging tests-mesh tests-gitops --import-mode=importlib -q
      - name: Start isolated PostgreSQL Redis and Keycloak
        run: bash scripts/lab11/start-ci-services.sh
      - name: Test all Orders modules with coverage gate
        run: bash scripts/lab11/ci-tests.sh
      - name: Validate candidate chart
        run: |
          helm lint helm/msvc-chart -f helm/values/order-service.yaml --set image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          helm template order-service helm/msvc-chart -n microservices -f helm/values/order-service.yaml --set image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa > reports/lab11/chart.yaml
          python scripts/lab11/validate-render.py reports/lab11/chart.yaml reports/lab11/kubernetes-1.35.8.json
      - name: Build the immutable candidate
        run: |
          docker build --build-arg APP_VERSION="$APP_VERSION" --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "lab11-order-service:$GITHUB_SHA" -f order-service/Dockerfile .
          docker save "lab11-order-service:$GITHUB_SHA" -o reports/lab11/order-service.tar
      - name: Block every CRITICAL vulnerability before publication
        run: trivy image --input reports/lab11/order-service.tar --scanners vuln --severity CRITICAL --ignorefile /dev/null --format json --output reports/lab11/trivy.json --exit-code 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lab11-approved-image
          path: reports/lab11/order-service.tar
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: lab11-quality-reports
          path: |
            reports/lab11/coverage.xml
            reports/lab11/tests.xml
            reports/lab11/trivy.json
      - name: Remove only isolated CI containers
        if: always()
        run: bash scripts/lab11/stop-ci-services.sh
  publish:
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: lab11-approved-image
          path: reports/lab11
      - name: Publish the same tested archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/$owner/lab11-order-service"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker load -i reports/lab11/order-service.tar
          docker tag "lab11-order-service:$GITHUB_SHA" "$image:$GITHUB_SHA"
          docker push "$image:$GITHUB_SHA" | tee reports/lab11/push.txt
          digest=$(sed -nE 's/.*digest: (sha256:[a-f0-9]{64}).*/\1/p' reports/lab11/push.txt | tail -1)
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "IMAGE_REPOSITORY=$image" >> "$GITHUB_ENV"
          echo "IMAGE_DIGEST=$digest" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: vars.GITOPS_REPOSITORY != ''
        with:
          repository: ${{ vars.GITOPS_REPOSITORY }}
          token: ${{ secrets.GITOPS_WRITE_TOKEN }}
          path: .gitops-work
          ref: main
          fetch-depth: 0
      - name: Validate and push the actual GitOps configuration
        if: vars.GITOPS_REPOSITORY != ''
        run: |
          python -m pip install PyYAML==6.0.2 jsonschema==4.23.0
          bash scripts/lab11/install-helm.sh
          export PATH="$HOME/.local/bin:$PATH"
          git -C .gitops-work config user.name 'Lab11 CI'
          git -C .gitops-work config user.email 'lab11-ci@example.invalid'
          python scripts/lab11/gitops.py update .gitops-work "$IMAGE_REPOSITORY" "$IMAGE_DIGEST" "$APP_VERSION" "$GITHUB_SHA"
      - name: Remove registry login
        if: always()
        run: docker logout ghcr.io
