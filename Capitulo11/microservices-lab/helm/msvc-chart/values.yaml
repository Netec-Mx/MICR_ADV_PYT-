name: order-service
port: 8001
replicaCount: 1
appVersion: 9.0.0
image:
  repository: localhost:5000/order-service
  digest: ''
  pullPolicy: Always
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: '1'
    memory: 512Mi
env: {}
mesh:
  enabled: false
  variant: stable
  extra:
    enabled: false
    variant: v2
    digest: ''
    appVersion: 10.1.0

imagePullSecrets: []
