apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "msvc.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "msvc.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- if .Values.mesh.enabled }}
    lab10-service: {{ .Values.name }}
    {{- else }}
    app: {{ .Values.name }}
    {{- end }}
  ports:
  - name: http
    port: {{ .Values.port }}
    targetPort: {{ .Values.port }}
