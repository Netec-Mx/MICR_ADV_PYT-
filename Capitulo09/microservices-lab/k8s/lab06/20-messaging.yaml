apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: microservices
spec:
  selector:
    app: redis
  ports:
  - name: tcp
    port: 6379
    targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7.2.5-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 6379
        env: []
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        command:
        - redis-server
        args:
        - --appendonly
        - 'yes'
        - --appendfsync
        - everysec
        - --maxmemory-policy
        - noeviction
        volumeMounts:
        - name: data
          mountPath: /data
        readinessProbe:
          exec: &id001
            command:
            - redis-cli
            - ping
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 12
        startupProbe:
          exec: *id001
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 60
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
  serviceName: redis
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper
  namespace: microservices
spec:
  selector:
    app: zookeeper
  ports:
  - name: tcp
    port: 2181
    targetPort: 2181
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zookeeper
  namespace: microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
    spec:
      containers:
      - name: zookeeper
        image: confluentinc/cp-zookeeper:7.6.1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 2181
        env:
        - name: ZOOKEEPER_CLIENT_PORT
          value: '2181'
        - name: ZOOKEEPER_TICK_TIME
          value: '2000'
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 512Mi
        volumeMounts:
        - name: data
          mountPath: /var/lib/zookeeper/data
          subPath: data
        - name: data
          mountPath: /var/lib/zookeeper/log
          subPath: log
        readinessProbe:
          exec: &id001
            command:
            - cub
            - zk-ready
            - localhost:2181
            - '3'
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 12
        startupProbe:
          exec: *id001
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 60
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 1000
  serviceName: zookeeper
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: microservices
spec:
  selector:
    app: kafka
  ports:
  - name: http
    port: 9092
    targetPort: 9092
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
      - name: kafka
        image: confluentinc/cp-kafka:7.6.1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9092
        env:
        - name: KAFKA_BROKER_ID
          value: '1'
        - name: KAFKA_ZOOKEEPER_CONNECT
          value: zookeeper:2181
        - name: KAFKA_LISTENERS
          value: INTERNAL://0.0.0.0:9092
        - name: KAFKA_ADVERTISED_LISTENERS
          value: INTERNAL://kafka:9092
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          value: INTERNAL:PLAINTEXT
        - name: KAFKA_INTER_BROKER_LISTENER_NAME
          value: INTERNAL
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: '1'
        - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
          value: '1'
        - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
          value: '1'
        - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
          value: 'false'
        - name: KAFKA_HEAP_OPTS
          value: -Xms256m -Xmx512m
        resources:
          requests:
            cpu: 200m
            memory: 768Mi
          limits:
            cpu: '2'
            memory: 1536Mi
        volumeMounts:
        - name: data
          mountPath: /var/lib/kafka/data
        readinessProbe:
          exec: &id001
            command:
            - kafka-topics
            - --bootstrap-server
            - localhost:9092
            - --list
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 12
        startupProbe:
          exec: *id001
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 60
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 1000
  serviceName: kafka
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 2Gi
