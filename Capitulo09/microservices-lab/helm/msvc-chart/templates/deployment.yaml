{{- if ne .Release.Namespace "microservices" }}{{ fail "Lab 9 requires namespace microservices (Vault role binding)" }}{{ end }}
{{- if ne (index .Values.env "VAULT_ROLE") .Values.name }}{{ fail "VAULT_ROLE must equal service name" }}{{ end }}
{{- if ne (index .Values.env "VAULT_SECRET_PATH") .Values.name }}{{ fail "VAULT_SECRET_PATH must equal service name" }}{{ end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "msvc.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "msvc.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ .Values.name }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 10001
      containers:
      - name: {{ .Values.name }}
        image: {{ printf "%s@%s" .Values.image.repository (required "Publish first: image.digest required" .Values.image.digest) | quote }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ["python", "-m", "shared.vault.launcher", "--port", {{ .Values.port | quote }}]
        ports:
        - name: http
          containerPort: {{ .Values.port }}
        envFrom:
        - configMapRef:
            name: {{ .Values.name }}-config
        env:
        {{- range $key, $value := .Values.env }}
        - name: {{ $key }}
          value: {{ $value | quote }}
        {{- end }}
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        startupProbe:
          httpGet: {path: /health, port: http}
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 60
        readinessProbe:
          httpGet: {path: /health, port: http}
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 12
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        volumeMounts:
        - name: vault-jwt
          mountPath: /var/run/secrets/vault
          readOnly: true
      volumes:
      - name: vault-jwt
        projected:
          defaultMode: 0440
          sources:
          - serviceAccountToken:
              path: token
              audience: vault
              expirationSeconds: 600
