global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
- /etc/prometheus/rules.yaml
- /etc/prometheus/demo/rules.yaml
alerting:
  alertmanagers:
  - static_configs:
    - targets:
      - alertmanager.monitoring.svc:9093
scrape_configs:
- job_name: microservices
  metrics_path: /metrics
  scrape_timeout: 5s
  static_configs:
  - targets:
    - order-service-metrics.microservices.svc:8001
    labels:
      service: order-service
  - targets:
    - inventory-service-metrics.microservices.svc:8002
    labels:
      service: inventory-service
  - targets:
    - users-service-metrics.microservices.svc:8003
    labels:
      service: users-service
